
name: Terraform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Deploy Cloudflare Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Check Cloudflare Secrets
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$TF_VAR_cloudflare_account_id" || exit 1
          test -n "$TF_VAR_cloudflare_api_token" || exit 1
          echo "Cloudflare secrets configured."

      - name: Test Cloudflare KV API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/30462a702c81b1cb09dc7bf74572ec52/storage/kv/namespaces" \
            -o response.json

          python -c "import json,sys; d=json.load(open('response.json')); print('Success:',d.get('success')); print('Errors:',d.get('errors')); sys.exit(0 if d.get('success') else 1)"

      - name: Terraform Init
        run: terraform init -upgrade -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Show Terraform Provider Version
        run: terraform providers

      - name: Debug Cloudflare Account Configuration
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Account ID length: ${#TF_VAR_cloudflare_account_id}"
          test -n "$TF_VAR_cloudflare_account_id"
          grep -n -E 'account_id|title|cloudflare_workers_kv_namespace' main.tf

      - name: Terraform Plan
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false

      - name: Terraform Apply
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve -input=false
