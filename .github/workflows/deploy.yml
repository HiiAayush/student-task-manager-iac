
name: Terraform CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  terraform:
    name: Deploy Cloudflare Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Check GitHub Secrets
      - name: Check Cloudflare Secrets
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TF_VAR_cloudflare_account_id" ]; then
            echo "Cloudflare Account ID is missing"
            exit 1
          fi

          if [ -z "$TF_VAR_cloudflare_api_token" ]; then
            echo "Cloudflare API Token is missing"
            exit 1
          fi

          echo "Cloudflare secrets are configured."

      # Test Cloudflare API
      - name: Test Cloudflare KV API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/30462a702c81b1cb09dc7bf74572ec52/storage/kv/namespaces" \
            -o response.json \
            -w "\nHTTP Status: %{http_code}\n"

          python -c "import json; d=json.load(open('response.json')); print('Success:', d.get('success')); print('Errors:', d.get('errors'))"

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      # Check installed providers
      - name: Show Terraform Provider Version
        run: terraform providers

      # Generate Terraform Plan
      - name: Terraform Plan
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false

      # Apply Infrastructure
      - name: Terraform Apply
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve -input=false
